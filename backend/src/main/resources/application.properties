spring.application.name=GALCOM
server.port=9090

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/galcom_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Seguridad JWT. En producción/entrega puede sobrescribirse con JWT_SECRET.
security.jwt.secret=${JWT_SECRET:GALCOM2026CibertecGALCOM2026Cibertec}
security.jwt.expiration-ms=3600000
